# Look of the app. Colours can be changed at any time.
# Original palette: teal-green accent on a clean white background.
# NOTE: the chart and chat-bubble colours live in core/config.py -> BRAND.
# Keep primaryColor below in sync with BRAND["accent"], and textColor with
# BRAND["ink"].
[theme]
primaryColor = "#2E7D6B"              # buttons, sliders, links (teal-green)
backgroundColor = "#FFFFFF"           # page background
secondaryBackgroundColor = "#F3F6F5"  # sidebar, input fields
textColor = "#1F2A2E"
font = "sans serif"
