# Look of the app. Colours can be changed at any time.
# Warm palette: a friendly orange accent on a soft cream background.
[theme]
primaryColor = "#E67A2E"              # buttons, sliders, links (warm orange)
backgroundColor = "#FDF6EE"           # page background (warm cream)
secondaryBackgroundColor = "#F8E8D6"  # sidebar, input fields (warm sand)
textColor = "#3B2E27"                 # warm dark brown
font = "sans serif"
