# Look of the app. Colours can be changed at any time.
# Brand palette (from the WG-Match pitch deck): coral-orange accent and deep
# plum text on a soft cream background.
[theme]
primaryColor = "#E85C42"              # buttons, sliders, links (coral-orange)
backgroundColor = "#FBF5EC"           # page background (soft cream)
secondaryBackgroundColor = "#F2E7DB"  # sidebar, input fields (warm sand)
textColor = "#2E2140"                 # deep plum / aubergine
font = "sans serif"
