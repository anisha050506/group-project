# Look of the app. Colours can be changed at any time.
# Brand palette (from the WG-Match pitch deck): dusty-rose accent and deep plum
# text on a soft cream background.
# NOTE: the chart and chat-bubble colours live in core/config.py -> BRAND.
# Keep primaryColor below in sync with BRAND["accent"], and textColor with
# BRAND["ink"].
[theme]
primaryColor = "#C85475"              # buttons, sliders, links (dusty rose)
backgroundColor = "#FBF5EC"           # page background (soft cream)
secondaryBackgroundColor = "#F3E6E6"  # sidebar, input fields (soft rose-cream)
textColor = "#2E2140"                 # deep plum / aubergine
font = "sans serif"
